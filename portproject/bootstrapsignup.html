<!-- Sign Up Header -->
<header class="masthead">

    <div class="container px-4 px-lg-5">

        <div class="text-center">

            <h1 class="mx-auto my-0 text-uppercase">
                Sign Up
            </h1>

            <h2 class="text-white-50 mx-auto mt-2 mb-5">
                Sign up to join the IPUFFGAS community.
            </h2>

        </div>

    </div>

</header>


<!-- Sign Up Section -->
<section class="signup-content bg-light">

    <div class="container px-4 px-lg-5">

        <div class="row gx-4 gx-lg-5 justify-content-center">

            <div class="col-lg-8">

                <div class="signup-box">

                    <h2 class="mb-4 text-center">
                        Create Account
                    </h2>


                    <form action="#" method="post">


                        <!-- Personal Information -->
                        <fieldset>

                            <legend>
                                Personal Information
                            </legend>


                            <!-- Name -->
                            <label for="name">
                                Name *
                            </label>

                            <input
                                class="form-control"
                                id="name"
                                name="name"
                                type="text"
                                required>


                            <!-- Email -->
                            <label for="email">
                                Email *
                            </label>

                            <input
                                class="form-control"
                                id="email"
                                name="email"
                                type="email"
                                required>


                            <!-- Phone -->
                            <label for="phone-number">
                                Phone Number
                            </label>

                            <input
                                class="form-control"
                                id="phone-number"
                                name="phone-number"
                                type="tel"
                                placeholder="123-456-7890">


                            <!-- Password -->
                            <label for="password">
                                Password *
                            </label>

                            <input
                                class="form-control"
                                id="password"
                                name="password"
                                type="password"
                                required>

                        </fieldset>


                        <!-- Preferences -->
                        <fieldset>

                            <legend>
                                Preferences
                            </legend>


                            <!-- Email Option -->
                            <div class="preference form-check">

                                <input
                                    class="form-check-input"
                                    id="contact-email"
                                    type="radio"
                                    name="contact-method"
                                    value="email"
                                    checked>

                                <label
                                    class="form-check-label"
                                    for="contact-email">

                                    Email

                                </label>

                            </div>


                            <!-- Phone Option -->
                            <div class="preference form-check">

                                <input
                                    class="form-check-input"
                                    id="contact-phone"
                                    type="radio"
                                    name="contact-method"
                                    value="phone">

                                <label
                                    class="form-check-label"
                                    for="contact-phone">

                                    Phone

                                </label>

                            </div>


                            <!-- Subscribe -->
                            <div class="preference form-check">

                                <input
                                    class="form-check-input"
                                    id="subscribe"
                                    type="checkbox"
                                    name="subscribe">

                                <label
                                    class="form-check-label"
                                    for="subscribe">

                                    Subscribe to updates

                                </label>

                            </div>

                        </fieldset>


                        <!-- Submit -->
                        <div class="text-center">

                            <button
                                class="btn btn-primary btn-lg"
                                type="submit">

                                Submit

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
