<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign Up - IPUFFGAS">
  <title>IPUFFGAS - Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #000;
    }

    .wrap {
      width: min(1000px, 95%);
      margin: 2rem auto;
    }

    header {
      background: #0b7118;
      color: white;
      text-align: center;
      padding: 20px;
      border-radius: 8px;
    }

    /* Flexbox Navigation */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      background: #0b7118;
      padding: 15px;
      margin-top: 10px;
      border-radius: 8px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    article {
      flex: 1;
      max-width: 700px;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
    }

    legend {
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .inline label {
      margin: 0;
    }

    button {
      align-self: flex-start;
      padding: 10px 25px;
      background: #0b7118;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }

    button:hover {
      background: #095d14;
    }

    footer {
      background: #0b7118;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
    }

    /* Responsive Flexbox */
    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        gap: 15px;
      }

      article {
        width: 100%;
      }
    }
  </style>

</head>

<body>

<div class="wrap">

  <header>
    <h1>Sign Up</h1>
    <p>Sign up to join the IPUFFGAS community.</p>
  </header>

  <nav aria-label="Main navigation">
    <a href="flexindex.html">Home</a>
    <a href="flexabout.html">About</a>
    <a href="flexsignup.html">Sign Up</a>
  </nav>

  <main>

    <article>

      <h2>Create Account</h2>

      <form action="#" method="post">

        <fieldset>

          <legend>Personal Information</legend>

          <label for="name">Name *</label>
          <input id="name" name="name" type="text" required>

          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required>

          <label for="phone-number">Phone Number</label>
          <input id="phone-number" name="phone-number" type="tel" placeholder="123-456-7890">

          <label for="password">Password *</label>
          <input id="password" name="password" type="password" required>

        </fieldset>

        <fieldset>

          <legend>Preferences</legend>

          <div class="inline">
            <input id="contact-email" type="radio" name="contact-method" value="email" checked>
            <label for="contact-email">Email</label>
          </div>

          <div class="inline">
            <input id="contact-phone" type="radio" name="contact-method" value="phone">
            <label for="contact-phone">Phone</label>
          </div>

          <div class="inline">
            <input id="subscribe" type="checkbox" name="subscribe">
            <label for="subscribe">Subscribe to updates</label>
          </div>

        </fieldset>

        <button type="submit">Submit</button>

      </form>

    </article>

  </main>

  <footer>
    <p>&copy; 2026 IPUFFGAS. All rights reserved.</p>
  </footer>

</div>

</body>
</html>
